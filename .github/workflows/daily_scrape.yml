name: Daily Jobs Scraper

on:
  schedule:
    # Runs at 8:00 AM UTC (adjust time zone as needed) on Tue, Wed, Thu, Fri, Sat
    - cron: '0 8 * * 2-6'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
          
      - name: Run Scraper
        run: python scraper.py
        
      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add history.json LATEST_JOBS.md
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: Daily jobs update" && git push)
